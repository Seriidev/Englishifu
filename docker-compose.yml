services:
  postgres:
    image: postgres:16-alpine
    container_name: englishcore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: englishcore
      POSTGRES_PASSWORD: englishcore
      POSTGRES_DB: englishcore
    volumes:
      - englishcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishcore -d englishcore"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  englishcore_pgdata:
